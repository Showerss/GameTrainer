# Linter config for ruff.
# Run with:  ruff check .

exclude = [".venv", "build", "__pycache__", "gametrainer.egg-info"]

[lint.per-file-ignores]
# Scripts and tests add the project root to sys.path before importing from
# src/, so their imports genuinely cannot sit at the top of the file.
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# Archived M3 diagnostics — same sys.path pattern, kept as milestone evidence.
"docs/m3/experiments/*.py" = ["E402"]
